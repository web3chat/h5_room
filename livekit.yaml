# h5_room LiveKit Server 配置
# 由 docker-compose.yml 的 livekit 服务挂载使用

port: 7880

# TLS 由 nginx 等反向代理统一终结:
# 443 的 WSS → 反代到 7880 普通 WS（LiveKit 自身不做信令 TLS）

rtc:
  tcp_port: 7881
  udp_port: 7882
  # Docker 端口映射下让 LiveKit 自动探测对外 IP 作为 ICE candidate。
  # 若局域网/本机媒体不通（路由器 NAT hairpin 不支持等），
  # 改为 node_ip 显式指定宿主机局域网 IP，如:
  #   node_ip: "192.168.1.100"
  use_external_ip: true

# 接入密钥，与 config.yaml 的 livekit.api_key / api_secret 一致。
# 本地开发默认值，生产环境必须更换。
keys:
  devkey: secret

# 本项目自己的 Redis（compose 服务名 redis），
# 口令与 .env 的 REDIS_PASSWORD / config.yaml 的 redis.password 一致。
redis:
  address: redis:6379
  password: "changeme"
  db: 0

# 全局兜底: 每个房间最多 5 人。
# 语音房间的 10 人上限由后端签发 token 时的 roomConfig.max_participants 下发，
# 不使用 room_configs（LiveKit 没有这个配置键，严格模式下会启动失败）。
room:
  max_participants: 5
